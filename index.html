<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FMGE Baseline</title>
<meta name="description" content="Self-paced 300-question FMGE baseline examination with offline progress saving.">
<meta name="theme-color" content="#fcf7f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FMGE Baseline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-->
<div class="wrap">
  <header class="top">
    <div class="logo">FMGE<span> / BASELINE</span><small>Self-paced diagnostic exam · Blush edition</small></div>
    <div class="topright">
      <span class="chip warn" id="netchip" hidden><i></i>Offline</span>
      <span class="chip" id="savechip" role="status" aria-live="polite"><i></i><span class="l">Loading…</span></span>
      <nav class="desknav" aria-label="Main">
        <button data-tab="home">Overview</button><button data-tab="exam">Exam</button><button data-tab="report">Analytics</button><button data-tab="settings">Settings</button>
      </nav>
    </div>
  </header>
  <div id="updateRoot"></div>
  <main id="screen" class="screen"><noscript>This app needs JavaScript.</noscript></main>
  <footer class="foot">FMGE / BASELINE · Blush Edition · Version 4.0 · Independent study tool, not an official exam</footer>
</div>
<nav class="tabbar" aria-label="Main">
  <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Overview</button>
  <button data-tab="exam"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Exam</button>
  <button data-tab="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
</nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<!--/APP-->
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
